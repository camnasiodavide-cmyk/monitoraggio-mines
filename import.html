<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101418"><title>Importa dati Mines+</title><style>body{margin:0;background:#101418;color:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:560px;margin:auto;padding:28px 16px}.b{background:#181e24;border:1px solid #2b343d;border-radius:16px;padding:18px}h1{font-size:22px}p{color:#aeb8c2;line-height:1.45}input{width:100%;padding:14px 0;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:750;background:#4dd08a;color:#08130d;margin-top:12px}#msg{margin-top:14px}</style></head><body><div class="w"><div class="b"><h1>Importa dati iniziali</h1><p>Seleziona il file JSON privato. I dati vengono salvati solo nel browser di questo dispositivo e non caricati nel repository GitHub.</p><input type="file" id="f" accept="application/json,.json"><button id="go">Importa e apri dashboard</button><div id="msg"></div></div></div><script>(function(){var K='mines-plus-data-v1',f=document.getElementById('f'),m=document.getElementById('msg');document.getElementById('go').onclick=function(){if(!f.files||!f.files[0]){m.textContent='Seleziona prima il file JSON.';return}var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.saldi)||!Array.isArray(x.movimenti))throw 0;localStorage.setItem(K,JSON.stringify(x));m.textContent='Dati importati correttamente.';setTimeout(function(){location.href='./'},500)}catch(e){m.textContent='File non valido.'}};r.readAsText(f.files[0])}})();</script></body></html>
